# Development override with hot reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Backend reloads from ./backend, Vite serves the frontend with HMR and proxies /api to the backend.

services:
  postgres:
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-54329}:5432"

  app:
    environment:
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-dev-secret-change-me}
    volumes:
      - ./backend:/app/backend
      - ./data/standards:/app/data/standards:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npx vite --host 0.0.0.0 --port 5173"]
    environment:
      API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${DEV_FRONTEND_PORT:-5173}:5173"
    depends_on:
      - app

volumes:
  frontend_node_modules:
