[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]  # FastAPI Depends() defaults; pairwise zip(x, x[1:])

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Question-family content catalogs hold long, human-authored sentences.
"app/services/families/*.py" = ["E501"]
